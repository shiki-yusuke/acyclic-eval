name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run example
      - run: npm run check:docs
      - run: npm pack --dry-run
      - if: matrix.node == '22'
        run: npm run verify:package

  runtime-node18:
    name: Node 18 packaged runtime smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acyclic-eval-package"
          TARBALL_NAME="$(npm pack --pack-destination "$RUNNER_TEMP/acyclic-eval-package" --json | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8"))[0].filename')"
          echo "TARBALL_PATH=$RUNNER_TEMP/acyclic-eval-package/$TARBALL_NAME" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install and smoke-test tarball on Node 18
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$RUNNER_TEMP/acyclic-eval-node18-smoke"
          mkdir -p "$SMOKE_DIR"
          cd "$SMOKE_DIR"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL_PATH"
          npx --no-install acyclic-eval --help
          node --input-type=module -e 'const api = await import("acyclic-eval"); if ([api.generate, api.evaluate, api.score].some((value) => typeof value !== "function")) process.exit(1); console.log("library import: function function function");'
          npx --no-install acyclic-eval generate --config node_modules/acyclic-eval/dist/examples/toy/config.js --out ./out
          npx --no-install acyclic-eval evaluate --config node_modules/acyclic-eval/dist/examples/toy/config.js --out ./out --samples 1
          npx --no-install acyclic-eval score --config node_modules/acyclic-eval/dist/examples/toy/config.js --out ./out --min-coverage 1
